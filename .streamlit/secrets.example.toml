# Copy this file to .streamlit/secrets.toml for local authentication testing.
# Do not commit real password hashes, tokens, cookie keys, LDAP hosts, or RSA keys.

AUTH_ENABLED = "auto"
AUTH_PROVIDER = "local"

[local_users."user@example.com"]
name = "User Name"
role = "admin"
permissions = ["*"]
password_hash = "pbkdf2_sha256$260000$replace-with-generated-salt$replace-with-generated-hash"

[session_state_names]
user = "anz_bi_login_user"
remember_me = "anz_bi_login_remember_me"
auth_result = "anz_bi_login_result"

[auth_cookie]
name = "anz_bi_login_cookie"
key = "replace-with-a-long-random-cookie-signing-key"
expiry_days = 1
auto_renewal = true
delay_sec = 0.1

[auth]
allowed_users = []
allowed_domains = ["example.com"]

# Optional LDAP mode. Set AUTH_PROVIDER = "ldap" and uncomment these settings
# only when the Streamlit deployment can reach the company LDAP/AD server.
#
# [ldap]
# server_path = "ldap://ldap.example.com"
# domain = "example"
# search_base = "dc=example,dc=com"
# attributes = [
#   "sAMAccountName",
#   "distinguishedName",
#   "userPrincipalName",
#   "mail",
#   "displayName",
#   "manager",
#   "title",
# ]
# use_ssl = true

[signin_form]
maxWidth = 460
align = "center"
busy_message = "正在验证账号..."

[signin_form.title]
text = "ANZ BI 登录"
size = "large"
align = "center"

[signin_form.username]
label = "账号"
placeholder = "邮箱或域账号"

[signin_form.password]
label = "密码"
placeholder = "请输入密码"

[signin_form.remember]
label = "保持登录"

[signin_form.submit]
label = "登录"

[signout_form]
formType = "inline"
align = "right"
busy_message = "正在退出..."
sleep_sec = 0.2

[signout_form.submit]
label = "退出登录"
